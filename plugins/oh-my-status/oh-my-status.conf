# oh-my-status configuration (~/.gemini/oh-my-agy/status.conf)
# Theme: catppuccin | dracula | nord | gruvbox | tokyonight | onedark | solarized | rosepine | mygo
THEME="catppuccin"

# Layout: default | minimal | powerline | pure | fancy | mygo
LAYOUT="fancy"

# Account segment (from agy statusLine stdin: email & plan_tier)
# ACCOUNT_FORMAT: user | email | tier | user+tier | email+tier
ACCOUNT_SHOW=true
ACCOUNT_FORMAT=user
# Account icon: uncomment to override; set to "" to hide.
# ACCOUNT_ICON=$'\xef\x80\x87'

# Append " [1M]" to the model name when context window size >= 1M.
MODEL_CTX_TAG=true

# Strip trailing " (High)" / " (Medium)" effort suffix from model name.
MODEL_STRIP_EFFORT=false

# Git-info cache TTL (seconds). git runs at most once per TTL. A branch switch,
# commit or stage shows up at the next render anyway (the cache watches .git);
# edits to working-tree files show up within TTL seconds. 0 = no cache.
GIT_CACHE_TTL=10

# Antigravity CLI extra indicators
# SHOW_MODE: show cycle_mode (auto / accept-edits / plan) when active
SHOW_MODE=true
# SHOW_COST: show estimated session USD spend when reported
SHOW_COST=false
# SHOW_TASKS: show running subagents / background tasks count when > 0
SHOW_TASKS=true

# Which quota family feeds the 5h / 7d meters:
#   auto   = follow the model (Gemini models -> gemini-*, others -> 3p-*)
#   gemini = always the gemini-5h / gemini-weekly buckets
#   3p     = always the 3p-5h / 3p-weekly buckets
QUOTA_FAMILY=auto
